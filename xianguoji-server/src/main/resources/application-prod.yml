server:
  forward-headers-strategy: framework
  tomcat:
    connection-timeout: 10s
    max-swallow-size: 10MB
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
    threads:
      max: 200
      min-spare: 20

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:xianguoji}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=${MYSQL_SSL:false}&requireSSL=${MYSQL_REQUIRE_SSL:false}&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:true}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    druid:
      max-active: 50
      min-idle: 10
      validation-query: SELECT 1
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 1000
        wall:
          enabled: true
          config:
            multi-statement-allow: false
            none-base-statement-allow: false
      stat-view-servlet:
        enabled: false
        allow: 127.0.0.1
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL:false}
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4

xianguoji:
  jwt:
    active-kid: ${JWT_ACTIVE_KID:v1}
    secrets:
      v1: ${JWT_SECRET_V1:}
      v2: ${JWT_SECRET_V2:}
    # 兼容旧配置
    secret: ${JWT_SECRET:}
  upload:
    base-dir: /data/xianguoji/upload
    domain: https://cdn.xianguoji.com
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucket: ${ALIYUN_OSS_BUCKET:}
    domain: https://cdn.xianguoji.com
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    hotspot:
      whitelist: ${HOTSPOT_WHITELIST_IPS:}
    alert:
      webhook: ${ALERT_WEBHOOK_URL:}
    xss:
      rich-text-paths: ${XSS_RICH_TEXT_PATHS:/api/admin/goods,/api/admin/announcement}
    alert-webhook: ${SECURITY_ALERT_WEBHOOK:}
    upload-max-size-mb: ${UPLOAD_MAX_SIZE_MB:10}
    brute-force-max-attempts: ${BRUTE_FORCE_MAX_ATTEMPTS:5}
    brute-force-lock-minutes: ${BRUTE_FORCE_LOCK_MINUTES:15}

# O-4: 健康检查端点
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
knife4j:
  enable: false
  production: true

logging:
  level:
    root: warn
    com.xianguoji: info
    com.alibaba.druid.filter.stat: info
  file:
    path: /var/log/xianguoji
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
