# 本地开发环境配置模板
# 1. 复制 xianguoji-server/.env.example 为 .env 并填入真实值
# 2. 此文件已使用 ${ENV_VAR} 引用，无需修改

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:xianguoji}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

xianguoji:
  wechat:
    appid: ${WECHAT_APPID:}
    secret: ${WECHAT_SECRET:}

logging:
  level:
    com.xianguoji: debug
