server:
  port: 8080
  servlet:
    context-path: /

spring:
  profiles:
    active: dev
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/xianguoji?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: REDACTED_DB_PASSWORD
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      stat-view-servlet:
        enabled: true
        login-username: druid
        login-password: druid
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      password: REDACTED_DB_PASSWORD

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.xianguoji.server.module.*.entity
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

xianguoji:
  jwt:
    secret: REDACTED_JWT_SECRET
    user-ttl-hours: 168
    admin-ttl-hours: 12
  upload:
    base-dir: D:/xianguoji/upload
    domain: http://127.0.0.1:8080/static
  sms:
    provider: mock
  wechat:
    appid: <your-appid>
    secret: <your-secret>
    pay:
      mch-id: <your-mchid>
      api-key-v3: <your-apikey>

logging:
  level:
    com.xianguoji: debug

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  # API 分组在 SwaggerConfig.java 中以 GroupedOpenApi Bean 定义，避免重复注册

knife4j:
  enable: true
  setting:
    language: zh_cn
