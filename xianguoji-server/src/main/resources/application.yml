server:
  port: 8080
  servlet:
    context-path: /

spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/xianguoji?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:CHANGE_ME}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      stat-view-servlet:
        enabled: true
        login-username: ${DRUID_USER:druid}
        login-password: ${DRUID_PASSWORD:CHANGE_ME}
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      password: ${REDIS_PASSWORD:CHANGE_ME}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.xianguoji.server.module.*.entity
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

xianguoji:
  cache:
    enabled: true
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_TO_32_BYTES_MIN}
    user-ttl-hours: 168
    admin-ttl-hours: 12
  upload:
    base-dir: D:/xianguoji/upload
    domain: http://127.0.0.1:8080/static
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucket: ${ALIYUN_OSS_BUCKET:}
    # 自定义访问域名（可选，未配置时使用 https://{bucket}.{endpoint}）
    domain:
  sms:
    provider: mock
  wechat:
    appid: ${WECHAT_APPID:CHANGE_ME}
    secret: ${WECHAT_SECRET:CHANGE_ME}
    pay:
      mch-id: <your-mchid>
      api-key-v3: <your-apikey>

logging:
  level:
    com.xianguoji: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  # API 分组在 SwaggerConfig.java 中以 GroupedOpenApi Bean 定义，避免重复注册

knife4j:
  enable: true
  setting:
    language: zh_cn
