server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    connection-timeout: 10s
    max-swallow-size: 10MB
    threads:
      max: 200
      min-spare: 20

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:xianguoji}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      stat-view-servlet:
        enabled: true
        login-username: ${DRUID_USER:druid}
        login-password: ${DRUID_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: 0
      password: ${REDIS_PASSWORD}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.xianguoji.server.module.*.entity
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

xianguoji:
  cache:
    enabled: true
  jwt:
    active-kid: ${JWT_ACTIVE_KID:v1}
    secrets:
      v1: ${JWT_SECRET_V1:CHANGE_ME_TO_32_BYTES_MIN}
      v2: ${JWT_SECRET_V2:}
    user-access-ttl-minutes: 120
    user-refresh-ttl-hours: 168
    admin-access-ttl-minutes: 30
    admin-refresh-ttl-hours: 12
    # 兼容旧配置
    secret: ${JWT_SECRET:}
  upload:
    base-dir: D:/xianguoji/upload
    domain: http://${SERVER_HOST:127.0.0.1}:${SERVER_PORT:8080}/static
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucket: ${ALIYUN_OSS_BUCKET:}
    # 自定义访问域名（可选，未配置时使用 https://{bucket}.{endpoint}）
    domain:
  sms:
    provider: mock
  wechat:
    appid: ${WECHAT_APPID}
    secret: ${WECHAT_SECRET}
    pay:
      mch-id: ${WECHAT_PAY_MCH_ID:}
      api-key-v3: ${WECHAT_PAY_API_KEY_V3:}
  # P2-6: 安全配置命名空间
  security:
    alert-webhook: ${SECURITY_ALERT_WEBHOOK:}
    upload-max-size-mb: ${UPLOAD_MAX_SIZE_MB:10}
    brute-force-max-attempts: ${BRUTE_FORCE_MAX_ATTEMPTS:5}
    brute-force-lock-minutes: ${BRUTE_FORCE_LOCK_MINUTES:15}

logging:
  level:
    com.xianguoji: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  # API 分组在 SwaggerConfig.java 中以 GroupedOpenApi Bean 定义，避免重复注册

knife4j:
  enable: true
  setting:
    language: zh_cn
