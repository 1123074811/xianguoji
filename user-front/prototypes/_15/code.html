<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .shimmer {
            background: linear-gradient(90deg, #f0eded 25%, #f6f3f2 50%, #f0eded 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background font-body-md min-h-screen">
<!-- TopAppBar -->
<header class="bg-white dark:bg-zinc-950 docked full-width top-0 z-50 border-b border-gray-100 dark:border-zinc-900 shadow-[0_2px_8px_rgba(0,0,0,0.04)] fixed w-full">
<div class="flex justify-between items-center h-14 px-4 w-full max-w-md mx-auto">
<button class="text-green-800 dark:text-green-500 hover:bg-zinc-50 dark:hover:bg-zinc-900 transition-colors active:opacity-70 flex items-center justify-center p-2 rounded-full">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="font-['Be_Vietnam_Pro'] text-lg font-bold text-green-800 dark:text-green-400 tracking-tight">鲜果记</h1>
<button class="text-green-800 dark:text-green-500 hover:bg-zinc-50 dark:hover:bg-zinc-900 transition-colors active:opacity-70 flex items-center justify-center p-2 rounded-full">
<span class="material-symbols-outlined">chat</span>
</button>
</div>
</header>
<main class="pt-20 pb-24 px-container-margin max-w-md mx-auto space-y-section-gap">
<!-- Tab Switcher (Simulated) -->
<div class="flex gap-md overflow-x-auto pb-sm no-scrollbar">
<button class="px-lg py-sm rounded-full bg-primary-container text-on-primary-container font-h3 text-label-sm whitespace-nowrap">全部状态</button>
<button class="px-lg py-sm rounded-full bg-surface-container text-on-surface-variant font-h3 text-label-sm whitespace-nowrap">购物车</button>
<button class="px-lg py-sm rounded-full bg-surface-container text-on-surface-variant font-h3 text-label-sm whitespace-nowrap">订单状态</button>
<button class="px-lg py-sm rounded-full bg-surface-container text-on-surface-variant font-h3 text-label-sm whitespace-nowrap">优惠券</button>
</div>
<!-- Section 1: Empty State (Cart Example) -->
<section class="bg-surface-container-lowest rounded-xl p-xl shadow-[0_2px_8px_rgba(0,0,0,0.04)] flex flex-col items-center text-center">
<div class="w-48 h-48 mb-lg relative">

</div>
<h2 class="font-h2 text-on-surface mb-xs">购物车空空如也</h2>
<p class="text-on-surface-variant text-body-md mb-xl max-w-[240px]">去挑选一些从果园直采的新鲜美味吧</p>
<button class="w-full py-md bg-primary text-on-primary rounded-full font-h3 transition-transform active:scale-95 shadow-sm">
                去逛逛
            </button>
</section>
<!-- Section 2: Loading State (Skeleton Grid) -->
<section class="space-y-md">
<div class="flex items-center justify-between">
<h3 class="font-h3 text-on-surface">正在为您寻找好果...</h3>
<div class="h-4 w-12 shimmer rounded-full"></div>
</div>
<div class="grid grid-cols-2 gap-card-gap">
<!-- Skeleton Card 1 -->
<div class="bg-surface-container-lowest rounded-xl overflow-hidden shadow-[0_2px_8px_rgba(0,0,0,0.04)]">
<div class="aspect-square w-full shimmer"></div>
<div class="p-md space-y-sm">
<div class="h-4 w-3/4 shimmer rounded"></div>
<div class="h-3 w-1/2 shimmer rounded"></div>
<div class="flex justify-between items-center pt-xs">
<div class="h-6 w-12 shimmer rounded"></div>
<div class="h-8 w-8 shimmer rounded-full"></div>
</div>
</div>
</div>
<!-- Skeleton Card 2 -->
<div class="bg-surface-container-lowest rounded-xl overflow-hidden shadow-[0_2px_8px_rgba(0,0,0,0.04)]">
<div class="aspect-square w-full shimmer"></div>
<div class="p-md space-y-sm">
<div class="h-4 w-2/3 shimmer rounded"></div>
<div class="h-3 w-3/4 shimmer rounded"></div>
<div class="flex justify-between items-center pt-xs">
<div class="h-6 w-10 shimmer rounded"></div>
<div class="h-8 w-8 shimmer rounded-full"></div>
</div>
</div>
</div>
</div>
</section>
<!-- Section 3: Error State (Network Example) -->
<section class="bg-surface-container-low rounded-xl p-xl border border-dashed border-outline-variant flex flex-col items-center text-center">
<div class="w-16 h-16 rounded-full bg-error-container flex items-center justify-center mb-md">
<span class="material-symbols-outlined text-error text-3xl">wifi_off</span>
</div>
<h2 class="font-h2 text-on-surface mb-xs">网络连接似乎断开了</h2>
<p class="text-on-surface-variant text-body-md mb-lg">检查一下网络，再次与新鲜连接</p>
<button class="px-xl py-sm bg-surface-container-highest text-on-surface rounded-full font-h3 flex items-center gap-xs hover:bg-outline-variant transition-colors active:scale-95">
<span class="material-symbols-outlined text-[20px]">refresh</span>
                重新加载
            </button>
</section>
<!-- Section 4: Secondary Empty State (Coupons) -->
<section class="bg-surface-container-low/50 rounded-xl p-lg flex items-center gap-lg">
<div class="w-20 h-20 flex-shrink-0 bg-surface-container-lowest rounded-lg p-sm flex items-center justify-center">
<span class="material-symbols-outlined text-outline text-4xl" style="font-variation-settings: 'FILL' 1;">confirmation_number</span>
</div>
<div class="flex-grow">
<h3 class="font-h3 text-on-surface text-body-lg">暂无可用优惠券</h3>
<p class="text-label-sm text-on-surface-variant mb-sm">关注鲜果记，获取更多果园福利</p>
<button class="text-primary font-h3 text-label-sm flex items-center">
                    查看已失效券 <span class="material-symbols-outlined text-[16px]">chevron_right</span>
</button>
</div>
</section>

<div class="flex justify-around items-center h-16 pb-safe w-full max-w-md mx-auto">

<span class="material-symbols-outlined">home</span>
<span class="font-['Be_Vietnam_Pro'] text-[10px] font-medium">首页</span>
</a>
<a class="flex flex-col items-center justify-center text-zinc-400 dark:text-zinc-600 hover:text-green-600 dark:hover:text-green-300 tap-highlight-transparent active:scale-95 transition-all duration-200" href="#">
<span class="material-symbols-outlined">grid_view</span>
<span class="font-['Be_Vietnam_Pro'] text-[10px] font-medium">分类</span>

<span class="font-['Be_Vietnam_Pro'] text-[10px] font-medium">订单</span>
</a>
<a class="flex flex-col items-center justify-center text-zinc-400 dark:text-zinc-600 hover:text-green-600 dark:hover:text-green-300 tap-highlight-transparent active:scale-95 transition-all duration-200" href="#">
