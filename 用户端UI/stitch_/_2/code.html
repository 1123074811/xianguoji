<body class="flex flex-col min-h-screen font-body-md">
<!-- Top Brand Area -->
<header class="flex flex-col items-center pt-24 pb-16 px-container-margin">
<div class="w-20 h-20 rounded-xl bg-primary-container flex items-center justify-center mb-6 shadow-[0_4px_12px_rgba(13,99,27,0.12)]">
<span class="material-symbols-outlined text-on-primary text-4xl" data-icon="potted_plant" style="font-variation-settings: 'FILL' 1;">potted_plant</span>
</div>
<h1 class="font-h1 text-h1 text-primary tracking-tight">鲜果记</h1>
<p class="text-on-surface-variant font-label-sm mt-2 opacity-80">精品果园 · 产地直采</p>
</header>
<!-- Main Form Content -->
<main class="flex-grow px-container-margin w-full max-w-md mx-auto">
<div class="space-y-6">
<!-- Input Phone Number -->
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
<span class="text-on-surface-variant font-body-md border-r border-outline-variant pr-3">+86</span>
</div>
<input class="w-full h-14 pl-16 pr-4 bg-surface-container-lowest border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body-lg placeholder:text-outline outline-none" placeholder="请输入手机号" type="tel"/>
</div>
<!-- Input Verification Code -->
<div class="relative flex gap-3">
<div class="relative flex-grow">
<input class="w-full h-14 px-4 bg-surface-container-lowest border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body-lg placeholder:text-outline outline-none" placeholder="验证码" type="text"/>
</div>
<button class="h-14 px-4 whitespace-nowrap text-primary font-h3 border border-primary/20 rounded-xl hover:bg-primary/5 active:bg-primary/10 transition-colors">
                    获取验证码
                </button>
</div>
<!-- Login Button -->
<button class="w-full h-14 bg-primary text-on-primary font-h2 rounded-full shadow-[0_4px_16px_rgba(13,99,27,0.2)] active:scale-[0.98] transition-all mt-4">
                立即登录
            </button>
<!-- Social Login Divider -->
<div class="relative flex items-center py-8">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink mx-4 text-on-surface-variant font-label-sm">其他登录方式</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- WeChat Login -->
<div class="flex flex-col items-center">
<button class="w-14 h-14 flex items-center justify-center bg-white border border-outline-variant rounded-full shadow-sm active:scale-95 transition-transform">
<img alt="WeChat" class="w-8 h-8" data-alt="A clean, minimalist 3D icon representing a messaging application symbol in a vibrant green and white color scheme. The icon is rendered with a soft matte finish against a pristine white background, matching the boutique farm-to-table UI aesthetic. Soft studio lighting creates a gentle depth, emphasizing a premium and modern digital brand identity." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD1du-CzX-f4CGMCj3AfzolAx1Zjw-JK_UzxdEFPaOuVIShdwYaNwicH2ltZUVbs9qJLfi77VBEz5xnp7P0NL8163bOxaQrYDLVPFEblHJahde1PckN3stwuebYrYfvKw0krYa6d2Ti6zlpwjMwKIzIe_95dJ9_LgJhE-mdodbiROXc2EpqGPch5kSh1KZJY_va9UHECkXRsL04C4SHMb2FMD4mhB_la-bdXgakRJMtpu-B9KGurco_7wtdYzCRXqS4QoXO5e50NMru"/>
</button>
<span class="text-on-surface-variant font-label-sm mt-3">微信快捷登录</span>
</div>
</div>
</main>
<!-- Footer Agreement -->
<footer class="pb-12 px-container-margin w-full max-w-md mx-auto">
<div class="flex items-start gap-2">
<input class="mt-1 w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary" id="privacy" type="checkbox"/>
<label class="text-on-surface-variant font-label-sm leading-relaxed select-none" for="privacy">
                登录即代表您已阅读并同意 <a class="text-primary font-medium hover:underline" href="#">《用户服务协议》</a> 与 <a class="text-primary font-medium hover:underline" href="#">《隐私权政策》</a>，授权鲜果记使用您的账号信息。
            </label>
</div>
</footer>
<!-- Decorative Background Image (Subtle) -->
<div class="fixed bottom-0 right-0 -z-10 opacity-10 pointer-events-none overflow-hidden">
<img class="w-64 h-64 object-cover" data-alt="A high-definition, professional food photography shot of fresh, dew-covered green pears and vine-ripened grapes on a neutral beige ceramic plate. The lighting is soft and natural, coming from the side to highlight the organic textures and vibrant natural greens. This visual reinforces the boutique orchard experience and the premium quality of the brand's produce in a bright, modern minimalist environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuARS_apXGl7n_YAhqwIiHw0BJkmgbrS3lX3wPkrrLCOOYxmxzyrK2_pBh7f--dP3gdrmTonh6CBNbuTrziOZWFgkIb8yAefhZAeNFgU-rkt6gFqoKHm6JLMcjFFhLn1wpGha7nYB9DpWfFKRNpZy_4xkcsdg6rkCB6h8hS6S6W_KRrSKwk7wMB6_1kdsRA_PD-5hbMVjil_zpsgHxCyJAnjAimveGsXnhUfClDpJ8XgdGEu4eHwibQYUEK8-PEIhl6CLfFwxwAXP7n9"/>
