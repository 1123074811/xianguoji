<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-container": "#b35200",
                        "on-primary-fixed": "#002204",
                        "surface-container-high": "#e9e8e7",

                        "on-secondary": "#ffffff",
                        "inverse-on-surface": "#f2f0f0",
                        "secondary-container": "#cde5fe",
                        "on-tertiary-fixed-variant": "#763300",
                        "on-background": "#1b1c1c",
                        "surface-dim": "#dbdad9",
                        "on-secondary-container": "#50677b",
                        "outline": "#707a6c",

                        "surface-bright": "#fbf9f9",

                        "on-primary-fixed-variant": "#005312",
                        "secondary": "#4a6175",

                    },
                    "borderRadius": {

                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "stack-xs": "4px",
                        "unit": "4px",
                        "table-row-height": "48px",
                        "container-padding-pc": "24px",
                        "stack-md": "16px",
                        "gutter": "16px",
                        "container-padding-mobile": "16px",
                        "stack-lg": "24px"
                    },
                    "fontFamily": {
                        "label-bold": ["Be Vietnam Pro"],
                        "body-lg": ["Be Vietnam Pro"],
                        "h2": ["Be Vietnam Pro"],
                        "h1": ["Be Vietnam Pro"],
                        "body-sm": ["Be Vietnam Pro"],
                        "h3": ["Be Vietnam Pro"],
                        "body-md": ["Be Vietnam Pro"],
                        "table-header": ["Be Vietnam Pro"]
                    },
                    "fontSize": {
                        "label-bold": ["14px", {"lineHeight": "20px", "fontWeight": "600"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "h2": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "h1": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                        "body-sm": ["12px", {"lineHeight": "18px", "fontWeight": "400"}],
                        "h3": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "table-header": ["13px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #fbf9f9;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="antialiased">
<!-- Login Container -->
<main class="min-h-screen flex flex-col md:flex-row overflow-hidden">
<!-- Left Side: Brand Illustration (60%) -->
<section class="relative hidden md:flex md:w-[60%] h-screen bg-primary overflow-hidden items-center justify-center">
<!-- Background Image with Overlay -->
<div class="absolute inset-0 z-0">
<img alt="Fresh Organic Fruits" class="w-full h-full object-cover opacity-40 mix-blend-overlay" data-alt="A vibrant, high-resolution display of assorted fresh organic fruits including sliced oranges, kiwi, and berries arranged in a contemporary top-down view. The lighting is bright and airy with soft shadows, creating a healthy and vital atmosphere. The color palette is dominated by nature-inspired greens and citrus tones to align with the Fresh Fruit Diary brand identity. The composition is clean and professional, suitable for a corporate merchant portal background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAtCa8AA4krFV3jyn4BVQzz7sUXd45lmabBmneXMow6M_WTESVGJYqN-cW58Hrdr8L8YpyOM0fOuTKD2D_zhE8DQsNXOzLLCs0uLFf1jFwtxzRtoh-6tLKp-txiMTKW0wVpjPZYChRDkL_Qdu7BR2zZdwYbw2oWcX30u17EUBMzPhfwBS1ZwPU8s_PIAL84w16ULAyuyYvAI3dihEyUsUDHRS7MJXTO-rqKGtquy2kDq4js6y_d92l-JkyCmnt-QS7WbvWWcSYoEesz"/>
</div>
<!-- Branding Content -->
<div class="relative z-10 flex flex-col items-center text-center px-12">
<div class="mb-stack-lg p-6 glass-panel rounded-full shadow-2xl">
<span class="material-symbols-outlined text-white text-6xl" data-icon="restaurant">restaurant</span>
</div>
<h1 class="font-h1 text-h1 text-white tracking-tight mb-stack-sm">鲜果记</h1>
<p class="font-body-lg text-body-lg text-primary-fixed max-w-md">
                    为现代鲜果商户与物流管理量身打造，融合自然活力与精准运营。
                </p>
<!-- Decorative Bento Elements -->
<div class="mt-12 grid grid-cols-2 gap-gutter w-full max-w-lg">
<div class="glass-panel p-stack-md rounded-xl text-left border-white/10">
<span class="material-symbols-outlined text-white mb-2" data-icon="inventory_2">inventory_2</span>
<div class="font-label-bold text-label-bold text-white">智能库存</div>
<div class="font-body-sm text-body-sm text-white/70">实时保鲜周期追踪</div>
</div>
<div class="glass-panel p-stack-md rounded-xl text-left border-white/10">
<span class="material-symbols-outlined text-white mb-2" data-icon="trending_up">trending_up</span>
<div class="font-label-bold text-label-bold text-white">盈利分析</div>
<div class="font-body-sm text-body-sm text-white/70">详尽的销售表现洞察</div>
</div>
</div>
</div>
<!-- Accent Curve -->
<div class="absolute bottom-0 left-0 right-0 h-32 bg-gradient-to-t from-primary to-transparent opacity-50"></div>
</section>
<!-- Right Side: Login Form (40%) -->
<section class="flex flex-col w-full md:w-[40%] bg-white items-center justify-center px-container-padding-mobile md:px-container-padding-pc relative">
<!-- Mobile Brand Logo (Visible only on mobile) -->
<div class="md:hidden flex items-center gap-2 mb-stack-lg">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="restaurant">restaurant</span>
<span class="font-h2 text-h2 text-primary">鲜果记</span>
</div>
<div class="w-full max-w-md">
<div class="mb-stack-lg">
<h2 class="font-h1 text-h1 text-on-surface mb-stack-xs">商家登录</h2>
<p class="font-body-md text-body-md text-on-surface-variant">欢迎回来，请输入您的商户凭据以继续管理。</p>
</div>
<form class="space-y-stack-md">
<!-- Account Input -->
<div class="space-y-stack-xs">
<label class="font-label-bold text-label-bold text-on-surface-variant" for="account">账号</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="person">person</span>
<input class="w-full pl-10 pr-4 h-12 border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body-md text-body-md" id="account" placeholder="请输入商户账号" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-stack-xs">
<label class="font-label-bold text-label-bold text-on-surface-variant" for="password">密码</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="lock">lock</span>
<input class="w-full pl-10 pr-4 h-12 border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body-md text-body-md" id="password" placeholder="请输入登录密码" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-sm" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Verification Code -->
<div class="space-y-stack-xs">
<label class="font-label-bold text-label-bold text-on-surface-variant" for="captcha">验证码</label>
<div class="flex gap-stack-md">
<div class="relative flex-1">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="verified_user">verified_user</span>
<input class="w-full pl-10 pr-4 h-12 border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body-md text-body-md" id="captcha" placeholder="输入验证码" type="text"/>
</div>
<div class="w-32 h-12 bg-surface-container rounded-lg border border-outline-variant overflow-hidden cursor-pointer flex items-center justify-center">
<img alt="Captcha Verification" class="w-full h-full object-cover brightness-95 contrast-125" data-alt="A clear, professional graphic for a website captcha verification." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDlaKy1xJx9A0GkYMvaZ4c5X9lBR8RenAgLZ9Cn-6sENBw6SIW0jCcvveqy4nb3JwLScUM3Xr-xdPlQCAx0EZAA_sgJujVFNdjdqwAMkxu-3rsCJwEiNxgBQZ5rPtK8vNGZuuQqChb9pBYtayO7kVY1pxbEmbIYQffDN_Gxf9utTpKPbcmuQilV1-ZCaebKUEPD0wduujfPD2oBRkTQEZJ3II_YUEdgwLCl1lsAekh3NwDntWSzaI6w2gLN8cS7KdyV0ReCzmHSN7n_"/>
</div>
</div>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between pt-stack-xs">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">记住我</span>
</label>
<a class="font-body-sm text-body-sm text-primary hover:underline font-medium" href="#">忘记密码？</a>
</div>
<!-- Login Button -->
<button class="w-full h-12 bg-primary text-white rounded-lg font-label-bold text-label-bold hover:bg-primary/90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-md" type="submit">
<span>登录</span>
<span class="material-symbols-outlined text-sm" data-icon="login">login</span>
</button>
</form>
<!-- Additional Options -->
<div class="mt-stack-lg text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                        还没有账号？ <a class="text-primary font-medium hover:underline" href="#">申请商户入驻</a>
</p>
</div>
</div>
<!-- Footer -->
<footer class="absolute bottom-8 left-0 right-0 text-center">
<p class="font-body-sm text-body-sm text-outline">
                    鲜果记 · 单店版 v1.0
                </p>
<div class="flex justify-center gap-stack-md mt-2">
<a class="font-body-sm text-body-sm text-outline hover:text-on-surface-variant transition-colors" href="#">隐私政策</a>
<span class="text-outline-variant">|</span>
<a class="font-body-sm text-body-sm text-outline hover:text-on-surface-variant transition-colors" href="#">服务条款</a>
<span class="text-outline-variant">|</span>
<a class="font-body-sm text-body-sm text-outline hover:text-on-surface-variant transition-colors" href="#">系统反馈</a>
</div>
</footer>
</section>
</main>
</body></html>
